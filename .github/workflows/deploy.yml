name: Deploy to VPS

# Déploiement : écrit le .env du VPS puis lance scripts/deploy.sh (garde « séance en cours »,
# install, build, migrations Prisma, redémarrage PM2, contrôle de santé, retour arrière).
# Automatique après une CI verte sur un push master ; manuel via workflow_dispatch.
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master
  workflow_dispatch:
    inputs:
      branch:
        description: Branche à déployer (laisse vide pour utiliser la branche sélectionnée)
        required: false
        type: string
        default: ''
      force:
        description: Déployer même si des sessions sont en cours
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust VPS host key
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_KNOWN_HOSTS:-}" ]; then
            echo "::error::Secret GitHub VPS_KNOWN_HOSTS manquant ou vide (sortie de ssh-keyscan du VPS)."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          APP_URL_ADMIN: ${{ secrets.APP_URL_ADMIN }}
          APP_URL_CONSOLE: ${{ secrets.APP_URL_CONSOLE }}
          APP_URL_MOBILE: ${{ secrets.APP_URL_MOBILE }}
          NEXT_PUBLIC_PLAY_URL: ${{ secrets.NEXT_PUBLIC_PLAY_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          PRIZE_HMAC_SECRET: ${{ secrets.PRIZE_HMAC_SECRET }}
          PRIZE_REDEEM_BASE_URL: ${{ secrets.PRIZE_REDEEM_BASE_URL }}
          PRIZE_UNSUBSCRIBE_BASE_URL: ${{ secrets.PRIZE_UNSUBSCRIBE_BASE_URL }}
          PM2_APP_NAME: ${{ secrets.PM2_APP_NAME }}
          # Observabilité (PR8) — optionnels : absent = non modifié sur le VPS
          SENTRY_DSN_API: ${{ secrets.SENTRY_DSN_API }}
          NEXT_PUBLIC_SENTRY_DSN_ADMIN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN_ADMIN }}
          NEXT_PUBLIC_SENTRY_DSN_CONSOLE: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN_CONSOLE }}
          NEXT_PUBLIC_SENTRY_DSN_PLAYER: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN_PLAYER }}
          NEXT_PUBLIC_SENTRY_DSN_MOBILE: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN_MOBILE }}
          NEXT_PUBLIC_DEV_PLAY_PASSWORD: ${{ secrets.NEXT_PUBLIC_DEV_PLAY_PASSWORD }}
          SENTRY_ENVIRONMENT: ${{ secrets.SENTRY_ENVIRONMENT }}
          ADMIN_ALERT_EMAILS: ${{ secrets.ADMIN_ALERT_EMAILS }}
          HEALTH_CHECK_TOKEN: ${{ secrets.HEALTH_CHECK_TOKEN }}
          # IA — obligatoire en prod (Anthropic)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Paramètres du déploiement (passés par variables pour éviter toute injection dans le script)
          DEPLOY_BRANCH: ${{ github.event.inputs.branch || github.event.workflow_run.head_branch || github.ref_name }}
          DEPLOY_FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '1' || '0' }}
        run: |
          set -euo pipefail

          workflow_emit_optional_b64() {
            local n="$1"
            local v="${2:-}"
            if [ -z "$v" ]; then return 0; fi
            printf '%s\n' "${n}_B64=$(printf '%s' "$v" | base64 -w0)"
          }

          workflow_emit_optional_decode_and_upsert() {
            local n="$1"
            local v="${2:-}"
            if [ -z "$v" ]; then return 0; fi
            printf '%s\n' \
              'if [ -n "${'"$n"'_B64:-}" ]; then' \
              '  '"$n"'="$(printf "%s" "$'"$n"'_B64" | base64 -d)"' \
              '  upsert_env '"$n"' "$'"$n"'"' \
              'fi'
          }
          for key in SESSION_SECRET JWT_SECRET DATABASE_URL CORS_ORIGINS NEXT_PUBLIC_API_URL APP_URL_ADMIN APP_URL_CONSOLE SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS SMTP_FROM SMTP_FROM_NAME PRIZE_HMAC_SECRET PRIZE_REDEEM_BASE_URL PRIZE_UNSUBSCRIBE_BASE_URL ANTHROPIC_API_KEY; do
            eval "v=\${$key:-}"
            if [ -z "$v" ]; then
              echo "::error::Secret GitHub $key manquant ou vide."
              exit 1
            fi
          done

          SESSION_SECRET_B64="$(printf '%s' "$SESSION_SECRET" | base64 -w0)"
          JWT_SECRET_B64="$(printf '%s' "$JWT_SECRET" | base64 -w0)"
          DATABASE_URL_B64="$(printf '%s' "$DATABASE_URL" | base64 -w0)"
          CORS_ORIGINS_B64="$(printf '%s' "$CORS_ORIGINS" | base64 -w0)"
          NEXT_PUBLIC_API_URL_B64="$(printf '%s' "$NEXT_PUBLIC_API_URL" | base64 -w0)"
          APP_URL_ADMIN_B64="$(printf '%s' "$APP_URL_ADMIN" | base64 -w0)"
          APP_URL_CONSOLE_B64="$(printf '%s' "$APP_URL_CONSOLE" | base64 -w0)"
          SMTP_HOST_B64="$(printf '%s' "$SMTP_HOST" | base64 -w0)"
          SMTP_PORT_B64="$(printf '%s' "$SMTP_PORT" | base64 -w0)"
          SMTP_USER_B64="$(printf '%s' "$SMTP_USER" | base64 -w0)"
          SMTP_PASS_B64="$(printf '%s' "$SMTP_PASS" | base64 -w0)"
          SMTP_FROM_B64="$(printf '%s' "$SMTP_FROM" | base64 -w0)"
          SMTP_FROM_NAME_B64="$(printf '%s' "$SMTP_FROM_NAME" | base64 -w0)"
          PRIZE_HMAC_SECRET_B64="$(printf '%s' "$PRIZE_HMAC_SECRET" | base64 -w0)"
          PRIZE_REDEEM_BASE_URL_B64="$(printf '%s' "$PRIZE_REDEEM_BASE_URL" | base64 -w0)"
          PRIZE_UNSUBSCRIBE_BASE_URL_B64="$(printf '%s' "$PRIZE_UNSUBSCRIBE_BASE_URL" | base64 -w0)"
          ANTHROPIC_API_KEY_B64="$(printf '%s' "$ANTHROPIC_API_KEY" | base64 -w0)"

          BRANCH="$DEPLOY_BRANCH"
          FORCE="$DEPLOY_FORCE"
          if [ "$FORCE" = "1" ]; then echo "::warning::Déploiement forcé : garde des sessions en cours désactivée."; fi
          {
            echo 'set -euo pipefail'
            echo "cd \"${{ secrets.PROJECT_PATH }}\""
            echo "SESSION_SECRET_B64=${SESSION_SECRET_B64}"
            echo "JWT_SECRET_B64=${JWT_SECRET_B64}"
            echo "DATABASE_URL_B64=${DATABASE_URL_B64}"
            echo "CORS_ORIGINS_B64=${CORS_ORIGINS_B64}"
            echo "NEXT_PUBLIC_API_URL_B64=${NEXT_PUBLIC_API_URL_B64}"
            echo "APP_URL_ADMIN_B64=${APP_URL_ADMIN_B64}"
            echo "APP_URL_CONSOLE_B64=${APP_URL_CONSOLE_B64}"
            echo "SMTP_HOST_B64=${SMTP_HOST_B64}"
            echo "SMTP_PORT_B64=${SMTP_PORT_B64}"
            echo "SMTP_USER_B64=${SMTP_USER_B64}"
            echo "SMTP_PASS_B64=${SMTP_PASS_B64}"
            echo "SMTP_FROM_B64=${SMTP_FROM_B64}"
            echo "SMTP_FROM_NAME_B64=${SMTP_FROM_NAME_B64}"
            echo "PRIZE_HMAC_SECRET_B64=${PRIZE_HMAC_SECRET_B64}"
            echo "PRIZE_REDEEM_BASE_URL_B64=${PRIZE_REDEEM_BASE_URL_B64}"
            echo "PRIZE_UNSUBSCRIBE_BASE_URL_B64=${PRIZE_UNSUBSCRIBE_BASE_URL_B64}"
            echo "ANTHROPIC_API_KEY_B64=${ANTHROPIC_API_KEY_B64}"
            workflow_emit_optional_b64 APP_URL_MOBILE "${APP_URL_MOBILE:-}"
            workflow_emit_optional_b64 NEXT_PUBLIC_PLAY_URL "${NEXT_PUBLIC_PLAY_URL:-}"
            workflow_emit_optional_b64 SENTRY_DSN_API "${SENTRY_DSN_API:-}"
            workflow_emit_optional_b64 NEXT_PUBLIC_SENTRY_DSN_ADMIN "${NEXT_PUBLIC_SENTRY_DSN_ADMIN:-}"
            workflow_emit_optional_b64 NEXT_PUBLIC_SENTRY_DSN_CONSOLE "${NEXT_PUBLIC_SENTRY_DSN_CONSOLE:-}"
            workflow_emit_optional_b64 NEXT_PUBLIC_SENTRY_DSN_PLAYER "${NEXT_PUBLIC_SENTRY_DSN_PLAYER:-}"
            workflow_emit_optional_b64 NEXT_PUBLIC_SENTRY_DSN_MOBILE "${NEXT_PUBLIC_SENTRY_DSN_MOBILE:-}"
            workflow_emit_optional_b64 NEXT_PUBLIC_DEV_PLAY_PASSWORD "${NEXT_PUBLIC_DEV_PLAY_PASSWORD:-}"
            workflow_emit_optional_b64 SENTRY_ENVIRONMENT "${SENTRY_ENVIRONMENT:-}"
            workflow_emit_optional_b64 ADMIN_ALERT_EMAILS "${ADMIN_ALERT_EMAILS:-}"
            workflow_emit_optional_b64 HEALTH_CHECK_TOKEN "${HEALTH_CHECK_TOKEN:-}"
            echo 'SESSION_SECRET="$(printf "%s" "$SESSION_SECRET_B64" | base64 -d)"'
            echo 'JWT_SECRET="$(printf "%s" "$JWT_SECRET_B64" | base64 -d)"'
            echo 'DATABASE_URL="$(printf "%s" "$DATABASE_URL_B64" | base64 -d)"'
            echo 'CORS_ORIGINS="$(printf "%s" "$CORS_ORIGINS_B64" | base64 -d)"'
            echo 'NEXT_PUBLIC_API_URL="$(printf "%s" "$NEXT_PUBLIC_API_URL_B64" | base64 -d)"'
            echo 'APP_URL_ADMIN="$(printf "%s" "$APP_URL_ADMIN_B64" | base64 -d)"'
            echo 'APP_URL_CONSOLE="$(printf "%s" "$APP_URL_CONSOLE_B64" | base64 -d)"'
            echo 'SMTP_HOST="$(printf "%s" "$SMTP_HOST_B64" | base64 -d)"'
            echo 'SMTP_PORT="$(printf "%s" "$SMTP_PORT_B64" | base64 -d)"'
            echo 'SMTP_USER="$(printf "%s" "$SMTP_USER_B64" | base64 -d)"'
            echo 'SMTP_PASS="$(printf "%s" "$SMTP_PASS_B64" | base64 -d)"'
            echo 'SMTP_FROM="$(printf "%s" "$SMTP_FROM_B64" | base64 -d)"'
            echo 'SMTP_FROM_NAME="$(printf "%s" "$SMTP_FROM_NAME_B64" | base64 -d)"'
            echo 'PRIZE_HMAC_SECRET="$(printf "%s" "$PRIZE_HMAC_SECRET_B64" | base64 -d)"'
            echo 'PRIZE_REDEEM_BASE_URL="$(printf "%s" "$PRIZE_REDEEM_BASE_URL_B64" | base64 -d)"'
            echo 'PRIZE_UNSUBSCRIBE_BASE_URL="$(printf "%s" "$PRIZE_UNSUBSCRIBE_BASE_URL_B64" | base64 -d)"'
            echo 'ANTHROPIC_API_KEY="$(printf "%s" "$ANTHROPIC_API_KEY_B64" | base64 -d)"'
            echo 'touch .env'
            echo 'upsert_env() {'
            echo '  key="$1"; val="$2"'
            echo '  if grep -q "^${key}=" .env 2>/dev/null; then grep -v "^${key}=" .env > .env.tmp && mv .env.tmp .env; fi'
            echo '  printf "%s=%s\n" "$key" "$val" >> .env'
            echo '}'
            echo 'upsert_env_file() {'
            echo '  file="$1"; key="$2"; val="$3"'
            echo '  touch "$file"'
            echo '  if grep -q "^${key}=" "$file" 2>/dev/null; then grep -v "^${key}=" "$file" > "${file}.tmp" && mv "${file}.tmp" "$file"; fi'
            echo '  printf "%s=%s\n" "$key" "$val" >> "$file"'
            echo '}'
            echo 'apply_ai_env() {'
            echo '  upsert_env AI_PROVIDER anthropic'
            echo '  upsert_env ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"'
            echo '  mkdir -p api'
            echo '  upsert_env_file api/.env AI_PROVIDER anthropic'
            echo '  upsert_env_file api/.env ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"'
            echo '}'
            echo 'upsert_env SESSION_SECRET "$SESSION_SECRET"'
            echo 'upsert_env JWT_SECRET "$JWT_SECRET"'
            echo 'upsert_env DATABASE_URL "$DATABASE_URL"'
            echo 'upsert_env CORS_ORIGINS "$CORS_ORIGINS"'
            echo 'upsert_env NEXT_PUBLIC_API_URL "$NEXT_PUBLIC_API_URL"'
            echo 'upsert_env APP_URL_ADMIN "$APP_URL_ADMIN"'
            echo 'upsert_env APP_URL_CONSOLE "$APP_URL_CONSOLE"'
            echo 'STORAGE_PUBLIC_URL="${NEXT_PUBLIC_API_URL%/}/uploads"'
            echo 'upsert_env STORAGE_PUBLIC_URL "$STORAGE_PUBLIC_URL"'
            echo 'upsert_env SMTP_HOST "$SMTP_HOST"'
            echo 'upsert_env SMTP_PORT "$SMTP_PORT"'
            echo 'upsert_env SMTP_USER "$SMTP_USER"'
            echo 'upsert_env SMTP_PASS "$SMTP_PASS"'
            echo 'upsert_env SMTP_FROM "$SMTP_FROM"'
            echo 'upsert_env SMTP_FROM_NAME "$SMTP_FROM_NAME"'
            echo 'upsert_env PRIZE_HMAC_SECRET "$PRIZE_HMAC_SECRET"'
            echo 'upsert_env PRIZE_REDEEM_BASE_URL "$PRIZE_REDEEM_BASE_URL"'
            echo 'upsert_env PRIZE_UNSUBSCRIBE_BASE_URL "$PRIZE_UNSUBSCRIBE_BASE_URL"'
            workflow_emit_optional_decode_and_upsert APP_URL_MOBILE "${APP_URL_MOBILE:-}"
            echo 'if [ -n "${APP_URL_MOBILE:-}" ]; then upsert_env NEXT_PUBLIC_MOBILE_URL "$APP_URL_MOBILE"; fi'
            workflow_emit_optional_decode_and_upsert NEXT_PUBLIC_PLAY_URL "${NEXT_PUBLIC_PLAY_URL:-}"
            workflow_emit_optional_decode_and_upsert SENTRY_DSN_API "${SENTRY_DSN_API:-}"
            workflow_emit_optional_decode_and_upsert NEXT_PUBLIC_SENTRY_DSN_ADMIN "${NEXT_PUBLIC_SENTRY_DSN_ADMIN:-}"
            workflow_emit_optional_decode_and_upsert NEXT_PUBLIC_SENTRY_DSN_CONSOLE "${NEXT_PUBLIC_SENTRY_DSN_CONSOLE:-}"
            workflow_emit_optional_decode_and_upsert NEXT_PUBLIC_SENTRY_DSN_PLAYER "${NEXT_PUBLIC_SENTRY_DSN_PLAYER:-}"
            workflow_emit_optional_decode_and_upsert NEXT_PUBLIC_SENTRY_DSN_MOBILE "${NEXT_PUBLIC_SENTRY_DSN_MOBILE:-}"
            workflow_emit_optional_decode_and_upsert NEXT_PUBLIC_DEV_PLAY_PASSWORD "${NEXT_PUBLIC_DEV_PLAY_PASSWORD:-}"
            workflow_emit_optional_decode_and_upsert SENTRY_ENVIRONMENT "${SENTRY_ENVIRONMENT:-}"
            workflow_emit_optional_decode_and_upsert ADMIN_ALERT_EMAILS "${ADMIN_ALERT_EMAILS:-}"
            workflow_emit_optional_decode_and_upsert HEALTH_CHECK_TOKEN "${HEALTH_CHECK_TOKEN:-}"
            echo 'apply_ai_env'
            # scripts/deploy.sh n'existe sur le VPS qu'après le fetch : on récupère ce seul fichier.
            printf 'git fetch origin %q\n' "$BRANCH"
            printf 'git checkout %q -- scripts/deploy.sh\n' "origin/${BRANCH}"
            printf 'BRANCH=%q FORCE=%q bash scripts/deploy.sh\n' "$BRANCH" "$FORCE"
          } | ssh -o StrictHostKeyChecking=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash -s || rc=$?
          rc="${rc:-0}"
          if [ "$rc" = "3" ]; then
            echo "::error::Déploiement refusé : session(s) en cours sur le VPS. Relancer via workflow_dispatch avec force=true si nécessaire."
          elif [ "$rc" != "0" ]; then
            echo "::error::Déploiement en échec (code $rc). Voir le journal ci-dessus (ROLLBACK éventuel)."
          fi
          exit "$rc"
